<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Number</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Inter",
    "Segoe UI", Roboto, Arial, sans-serif;
  background:
    radial-gradient(circle at 20% 10%, rgba(102,87,238,.22) 0%, transparent 30%),
    radial-gradient(circle at 90% 40%, rgba(60,110,240,.14) 0%, transparent 28%),
    #0b0b12;
  color: #ececf3;
}

button {
  font: inherit;
  border: none;
  cursor: pointer;
}

/* APP */

.app {
  width: 100%;
  max-width: 480px;
  min-height: 100vh;
  margin: 0 auto;
  padding-top: 76px;
  padding-bottom: 100px;
  position: relative;
  background:
    linear-gradient(
      180deg,
      rgba(20,20,31,.96) 0%,
      rgba(14,14,22,.98) 100%
    );
}

/* TOP NAV */

.top-nav {
  position: fixed;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: min(100%, 480px);
  height: 66px;

  background: rgba(18,18,28,.85);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);

  border-bottom: 1px solid #262538;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 20px;

  z-index: 100;
}

.nav-icon {
  width: 44px;
  height: 44px;

  border-radius: 15px;

  background: linear-gradient(
    135deg,
    #24213d,
    #1e1b35
  );

  border: 1px solid #312d52;

  color: #a297ff;

  display: flex;
  align-items: center;
  justify-content: center;

  transition: .25s ease;
}

.nav-icon:hover {
  transform: scale(1.05);
}

.nav-icon svg {
  width: 24px;
  height: 24px;

  stroke: currentColor;
  fill: none;

  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.nav-title {
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 2px;
  color: #a297ff;
}


/* CONTENT */

.content {
  padding: 0 18px;
}


/* HERO */

.hero {
  text-align: center;
  padding-top: 20px;
  margin-bottom: 27px;
}

.hero h1 {
  font-size: 29px;
  font-weight: 800;
  letter-spacing: -.9px;

  background: linear-gradient(
    90deg,
    #8f84ff,
    #b98cff
  );

  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;

  margin-bottom: 8px;
}

.hero p {
  color: #8a8a9c;
  font-size: 14px;
}


/* SELECTOR */

.selector {
  width: 100%;
  min-height: 66px;

  padding: 7px;

  background: linear-gradient(
    135deg,
    #1b1a2c,
    #171b2b
  );

  border: 1px solid #2a2842;

  border-radius: 23px;

  display: flex;
  gap: 7px;

  margin-bottom: 17px;
}

.option {
  flex: 1;

  border-radius: 18px;

  background: transparent;

  color: #8a89a0;

  font-size: 16px;
  font-weight: 700;

  transition: .3s ease;
}

.option:hover:not(.active) {
  color: #c9c7dd;
}

.option.active {
  background: linear-gradient(
    135deg,
    #6657ee,
    #8767f6
  );

  color: #ffffff;

  box-shadow:
    0 8px 22px rgba(102,87,238,.4);
}


/* ACTIVITIES BUTTON */

.activities-button {
  width: 100%;
  min-height: 66px;

  border-radius: 22px;

  background: linear-gradient(
    135deg,
    #2c2c3c,
    #252534
  );

  border: 1px solid #34344a;

  color: #d6d6e4;

  font-size: 16px;
  font-weight: 800;
  letter-spacing: .2px;

  opacity: 0;
  transform: translateY(15px);

  pointer-events: none;

  transition:
    opacity .4s ease,
    transform .4s ease,
    background .45s ease,
    box-shadow .45s ease;

  margin-bottom: 28px;
}

.activities-button.visible {
  opacity: 1;
  transform: translateY(0);

  pointer-events: auto;
}

.activities-button.active {
  background: linear-gradient(
    135deg,
    #1fa85a,
    #33c46b
  );

  border-color: transparent;
  color: #ffffff;

  box-shadow:
    0 12px 30px rgba(39,200,107,.25);
}


/* PLACEHOLDER */

.initial-placeholder {
  text-align: center;

  padding: 35px 20px;

  color: #6f6e82;

  font-size: 14px;
}

.initial-placeholder.hidden {
  display: none;
}


/* ACTIVITIES */

.activities-section {
  opacity: 0;
  transform: translateY(25px);

  max-height: 0;

  overflow: hidden;

  transition:
    opacity .5s ease,
    transform .5s ease,
    max-height .7s ease;
}

.activities-section.visible {
  opacity: 1;
  transform: translateY(0);

  max-height: 1000px;
}


/* HEADING */

.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;

  margin-bottom: 15px;
}

.section-heading h2 {
  font-size: 21px;
  font-weight: 800;

  background: linear-gradient(
    90deg,
    #8f84ff,
    #b98cff
  );

  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.online-dot {
  width: 11px;
  height: 11px;

  border-radius: 50%;

  background: #36d576;

  box-shadow:
    0 0 0 6px rgba(54,213,118,.16),
    0 0 14px rgba(54,213,118,.5);
}


/* LIST */

.activities-list {
  height: calc(100vh - 250px);

  min-height: 330px;
  max-height: 620px;

  overflow-y: auto;

  padding: 2px 3px 25px 1px;

  scroll-behavior: smooth;
}

.activities-list::-webkit-scrollbar {
  width: 5px;
}

.activities-list::-webkit-scrollbar-track {
  background: #1a1a28;
  border-radius: 10px;
}

.activities-list::-webkit-scrollbar-thumb {
  background: linear-gradient(
    #6c5cf0,
    #9a6df8
  );

  border-radius: 10px;
}


/* ACTIVITY CARD */

.activity-card {
  width: 100%;

  min-height: 118px;

  padding: 11px;

  background:
    linear-gradient(
      135deg,
      #1c1b2b,
      #181725
    );

  border: 1px solid #2a2840;

  border-radius: 23px;

  display: flex;
  align-items: center;

  gap: 15px;

  margin-bottom: 13px;

  opacity: 0;
  transform: translateY(18px);

  transition:
    opacity .45s ease,
    transform .45s ease,
    box-shadow .25s ease,
    border .25s ease;
}

.activities-section.visible .activity-card {
  opacity: 1;
  transform: translateY(0);
}

.activities-section.visible .activity-card:nth-child(1) {
  transition-delay: .08s;
}

.activities-section.visible .activity-card:nth-child(2) {
  transition-delay: .18s;
}

.activities-section.visible .activity-card:nth-child(3) {
  transition-delay: .28s;
}

.activity-card:hover {
  border-color: #4a4380;

  box-shadow:
    0 12px 30px rgba(102,87,238,.18);
}


/* PHOTO */

.avatar {
  width: 94px;
  height: 94px;

  border-radius: 20px;

  overflow: hidden;

  flex-shrink: 0;

  background: #26243c;

  border: 3px solid #2c2a44;

  box-shadow:
    0 5px 16px rgba(0,0,0,.4);
}

.avatar img {
  width: 100%;
  height: 100%;

  object-fit: cover;

  display: block;
}


/* INFO */

.activity-info {
  flex: 1;
  min-width: 0;
}

.activity-name {
  font-size: 19px;
  font-weight: 800;

  color: #f1f1f7;

  margin-bottom: 8px;
}


/* BIGGER STATUS TEXT */

.activity-status {
  font-size: 15px;
  font-weight: 600;

  display: inline-flex;
  align-items: center;

  padding: 7px 11px;

  border-radius: 12px;

  background: rgba(124,108,255,.16);

  color: #a99fff;
}

.activity-card:first-child .activity-status {
  background: rgba(54,213,118,.15);
  color: #4fe08a;
}


/* ARROW */

.activity-arrow {
  width: 40px;
  height: 40px;

  border-radius: 13px;

  background: #24213d;

  color: #a297ff;

  display: flex;
  align-items: center;
  justify-content: center;

  flex-shrink: 0;
}

.activity-arrow svg {
  width: 23px;
  height: 23px;

  stroke: currentColor;
  fill: none;

  stroke-width: 2;

  stroke-linecap: round;
  stroke-linejoin: round;
}


/* BOTTOM NAV */

.bottom-nav {
  position: fixed;

  bottom: 0;
  left: 50%;

  transform: translateX(-50%);

  width: min(100%, 480px);

  height: 80px;

  background: rgba(18,18,28,.9);

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);

  border-top: 1px solid #262538;

  display: flex;

  justify-content: space-around;
  align-items: center;

  z-index: 100;
}

.bottom-item {
  width: 51px;
  height: 51px;

  display: flex;
  align-items: center;
  justify-content: center;

  background: transparent;

  color: #6c6b80;

  border-radius: 17px;

  transition: .25s ease;
}

.bottom-item:hover:not(.active) {
  color: #a9a8bd;
}

.bottom-item.active {
  color: #a297ff;

  background: linear-gradient(
    135deg,
    #24213d,
    #1e1b35
  );

  box-shadow:
    0 6px 16px rgba(102,87,238,.2);
}

.bottom-item svg {
  width: 25px;
  height: 25px;

  stroke: currentColor;
  fill: none;

  stroke-width: 2;

  stroke-linecap: round;
  stroke-linejoin: round;
}


/* DESKTOP */

@media (min-width: 600px) {

  body {
    background:
      radial-gradient(
        circle at 20% 20%,
        rgba(102,87,238,.2),
        transparent 32%
      ),
      #08080e;
  }

  .app {
    background: #12121c;

    box-shadow:
      0 0 70px rgba(0,0,0,.6);
  }
}


/* SMALL PHONES */

@media (max-width: 350px) {

  .content {
    padding: 0 14px;
  }

  .avatar {
    width: 78px;
    height: 78px;
  }

  .activity-name {
    font-size: 16px;
  }

  .activity-status {
    font-size: 13px;
    padding: 6px 8px;
  }

  .activity-arrow {
    width: 34px;
    height: 34px;
  }
}

</style>
</head>


<body>

<div class="app">


<!-- TOP NAV -->

<header class="top-nav">

  <button class="nav-icon">

    <svg viewBox="0 0 24 24">
      <path d="M15 18l-6-6 6-6"></path>
    </svg>

  </button>


  <div class="nav-title">
    CONTACTS
  </div>


  <button class="nav-icon">

    <svg viewBox="0 0 24 24">
      <path d="M12 5v14"></path>
      <path d="M5 12h14"></path>
    </svg>

  </button>

</header>



<main class="content">


<!-- HERO -->

<section class="hero">

  <h1>
    ADD NUMBER
  </h1>

  <p>
    Select a contact type to continue
  </p>

</section>



<!-- SELECTOR -->

<div class="selector">

  <button
    class="option"
    id="boyfriendOption">

    Boyfriend

  </button>


  <button
    class="option"
    id="sisterOption">

    Sister

  </button>

</div>



<!-- BUTTON -->

<button
  id="activitiesButton"
  class="activities-button">

  SEE ACTIVITIES

</button>



<div
  id="placeholder"
  class="initial-placeholder">

  Choose a contact above

</div>



<!-- ACTIVITIES -->

<section
  id="activitiesSection"
  class="activities-section">


  <div class="section-heading">

    <h2>
      CHATTING WITH
    </h2>

    <span class="online-dot"></span>

  </div>



  <div class="activities-list">


    <!-- ANNA -->

    <div class="activity-card">

      <div class="avatar">

        <img
          src="https://i.ibb.co/5hy8NkgM/8.jpg"
          alt="Anna">

      </div>


      <div class="activity-info">

        <div class="activity-name">
          Anna
        </div>

        <div class="activity-status">
          ● chatting now
        </div>

      </div>


      <div class="activity-arrow">

        <svg viewBox="0 0 24 24">
          <path d="M9 18l6-6-6-6"></path>
        </svg>

      </div>

    </div>



    <!-- LIZA -->

    <div class="activity-card">

      <div class="avatar">

        <img
          src="https://i.ibb.co/Z6KcqFbR/9.jpg"
          alt="Liza">

      </div>


      <div class="activity-info">

        <div class="activity-name">
          Liza
        </div>

        <div class="activity-status">
          12 min ago
        </div>

      </div>


      <div class="activity-arrow">

        <svg viewBox="0 0 24 24">
          <path d="M9 18l6-6-6-6"></path>
        </svg>

      </div>

    </div>



    <!-- SOPHIA -->

    <div class="activity-card">

      <div class="avatar">

        <img
          src="https://i.ibb.co/8L89BcQb/Sophia-paige.jpg"
          alt="Sophia">

      </div>


      <div class="activity-info">

        <div class="activity-name">
          Sophia
        </div>

        <div class="activity-status">
          3 days ago
        </div>

      </div>


      <div class="activity-arrow">

        <svg viewBox="0 0 24 24">
          <path d="M9 18l6-6-6-6"></path>
        </svg>

      </div>

    </div>


  </div>

</section>

</main>



<!-- BOTTOM NAV -->

<nav class="bottom-nav">


  <button class="bottom-item active">

    <svg viewBox="0 0 24 24">
      <path d="M3 11.5L12 4l9 7.5"></path>
      <path d="M5 10v9h14v-9"></path>
      <path d="M9 19v-5h6v5"></path>
    </svg>

  </button>



  <button class="bottom-item">

    <svg viewBox="0 0 24 24">
      <path d="M4 18V9"></path>
      <path d="M10 18V5"></path>
      <path d="M16 18v-7"></path>
      <path d="M22 18V3"></path>
    </svg>

  </button>



  <button class="bottom-item">

    <svg viewBox="0 0 24 24">
      <path d="M20 11.5a7.5 7.5 0 01-8 7.5 8.8 8.8 0 01-3.6-.8L4 20l1.5-3.8A7.3 7.3 0 014 11.5 7.5 7.5 0 0112 4a7.5 7.5 0 018 7.5z"></path>
    </svg>

  </button>



  <button class="bottom-item">

    <svg viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="3.5"></circle>
      <path d="M5 20c.8-3.5 3.1-5.5 7-5.5s6.2 2 7 5.5"></path>
    </svg>

  </button>


</nav>


</div>



<script>

const boyfriendOption =
  document.getElementById("boyfriendOption");

const sisterOption =
  document.getElementById("sisterOption");

const activitiesButton =
  document.getElementById("activitiesButton");

const activitiesSection =
  document.getElementById("activitiesSection");

const placeholder =
  document.getElementById("placeholder");


/* BOYFRIEND */

boyfriendOption.addEventListener("click", () => {

  boyfriendOption.classList.add("active");

  sisterOption.classList.remove("active");

  activitiesButton.classList.add("visible");

  activitiesButton.classList.remove("active");

  activitiesButton.textContent =
    "SEE ACTIVITIES";

  activitiesSection.classList.remove("visible");

  placeholder.classList.remove("hidden");

});


/* SISTER */

sisterOption.addEventListener("click", () => {

  sisterOption.classList.add("active");

  boyfriendOption.classList.remove("active");

  activitiesButton.classList.remove("visible");

  activitiesSection.classList.remove("visible");

  placeholder.classList.remove("hidden");

});


/* SEE ACTIVITIES */

activitiesButton.addEventListener("click", () => {

  if (
    activitiesButton.classList.contains("active")
  ) {
    return;
  }

  activitiesButton.classList.add("active");

  activitiesButton.textContent =
    "ACTIVITIES FOUND";

  placeholder.classList.add("hidden");


  setTimeout(() => {

    activitiesSection.classList.add("visible");

  }, 200);

});


/* BOTTOM NAV */

const bottomItems =
  document.querySelectorAll(".bottom-item");

bottomItems.forEach(item => {

  item.addEventListener("click", () => {

    bottomItems.forEach(button => {
      button.classList.remove("active");
    });

    item.classList.add("active");

  });

});

</script>

</body>
</html>
